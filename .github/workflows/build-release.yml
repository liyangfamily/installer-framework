# Build Qt Installer Framework tools on branch 4.11 and publish releases.
#
# Triggers:
#   - push to branch 4.11
#   - push tag: 4.11.*
#   - workflow_dispatch

name: Build and Release IFW

on:
  push:
    branches:
      - "4.11"
    tags:
      - "4.11.*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create/update a GitHub Release for the given tag"
        type: boolean
        default: false
      release_tag:
        description: "Release tag (e.g. 4.11.1-axi1). Required when create_release=true"
        type: string
        default: ""

concurrency:
  group: ifw-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 6.6.x 用 gcc_64；6.7+ 才是 linux_gcc_64（用错会报 qt_base/qt5compat not found）
  QT_VERSION: "6.6.3"
  QT_ARCH: "gcc_64"
  IFW_VERSION: "4.11"
  AQT_DIR: ${{ github.workspace }}/.aqt-qt

jobs:
  build-linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-cursor0 \
            libbz2-dev \
            liblzma-dev \
            zlib1g-dev \
            libzstd-dev

      - name: Install Qt via aqtinstall
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install "aqtinstall==3.1.*"
          python -m aqt list-qt linux desktop --arch "${QT_VERSION}"
          python -m aqt list-qt linux desktop --modules "${QT_VERSION}" "${QT_ARCH}"
          # 不要随便加 --archives：错误 arch 或精简包会导致 qt_base 解析失败
          python -m aqt install-qt linux desktop "${QT_VERSION}" "${QT_ARCH}" \
            -O "${AQT_DIR}" \
            -m qt5compat
          QT_ROOT="${AQT_DIR}/${QT_VERSION}/${QT_ARCH}"
          test -x "${QT_ROOT}/bin/qmake"
          echo "QT_ROOT=${QT_ROOT}" >> "$GITHUB_ENV"
          echo "${QT_ROOT}/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=${QT_ROOT}/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Build IFW
        run: |
          set -euo pipefail
          which qmake
          qmake -v
          mkdir -p build && cd build
          qmake ../installerfw.pro -r CONFIG+=release \
            "IFW_BZIP2_LIBRARY=-lbz2" \
            "IFW_LZMA_LIBRARY=-llzma"
          make -j"$(nproc)"
          ./bin/installerbase -v || true
          ./bin/binarycreator -v || true

      - name: Package tools
        run: |
          set -euo pipefail
          OUT="ifw-${IFW_VERSION}-linux-x64"
          mkdir -p "$OUT/bin"
          cp -a build/bin/{archivegen,binarycreator,installerbase,repogen} "$OUT/bin/"
          [ -x build/bin/devtool ] && cp -a build/bin/devtool "$OUT/bin/" || true
          cat > "$OUT/README.txt" <<EOF
          Qt Installer Framework ${IFW_VERSION} (linux-x64)
          Built with Qt ${QT_VERSION}
          Source: ${GITHUB_REPOSITORY}@${GITHUB_SHA}
          Patch: FileDownloader DownloadType queued-invoke fix
          EOF
          tar -C . -czf "${OUT}.tar.gz" "$OUT"
          ls -lh "${OUT}.tar.gz"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ifw-${{ env.IFW_VERSION }}-linux-x64
          path: ifw-${{ env.IFW_VERSION }}-linux-x64.tar.gz
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          name: IFW ${{ env.IFW_VERSION }} (${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }})
          body: |
            Qt Installer Framework **${{ env.IFW_VERSION }}** tools (linux-x64).

            - Built with Qt **${{ env.QT_VERSION }}**
            - Includes fix for online package download hang (`DownloadType` metatype)
            - Binaries: `archivegen`, `binarycreator`, `installerbase`, `repogen`
          files: ifw-${{ env.IFW_VERSION }}-linux-x64.tar.gz
          draft: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
