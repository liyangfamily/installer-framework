# Build Qt Installer Framework 4.11 tools with officially recommended static Qt.
#
# Docs: https://doc.qt.io/qtinstallerframework/ifw-building-from-sources.html
# Supported Qt for IFW 4.11: 6.9.1 (static advised so tools ship as single binaries).
#
# Triggers:
# - push to branch 4.11
# - push tag: 4.11.*
# - workflow_dispatch

name: Build and Release IFW

on:
  push:
    branches:
      - "4.11"
    tags:
      - "4.11.*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create/update a GitHub Release for the given tag"
        type: boolean
        default: false
      release_tag:
        description: "Release tag (e.g. 4.11.1-axi1). Required when create_release=true"
        type: string
        default: ""
      force_rebuild_qt:
        description: "Ignore static Qt cache and rebuild Qt from source"
        type: boolean
        default: false

concurrency:
  group: ifw-build-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.9.1"
  IFW_VERSION: "4.11"
  QT_PREFIX: /opt/qt-static-6.9.1
  # Bump when changing configure flags so the cache key invalidates.
  QT_STATIC_CACHE_REV: "v3"

jobs:
  build-linux:
    name: Linux x64 (static Qt)
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout IFW
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            perl \
            python3 \
            git \
            wget \
            xz-utils \
            pkg-config \
            libssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-cursor-dev \
            libxcb-glx0-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-shm0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libbz2-dev \
            liblzma-dev \
            zlib1g-dev \
            libzstd-dev

      - name: Cache static Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_PREFIX }}
          key: qt-static-${{ runner.os }}-${{ env.QT_VERSION }}-${{ env.QT_STATIC_CACHE_REV }}

      - name: Build static Qt ${{ env.QT_VERSION }}
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild_qt || steps.qt-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          QT_SRC="$HOME/qt-src-${QT_VERSION}"
          rm -rf "$QT_SRC" "${QT_PREFIX}"
          mkdir -p "$QT_SRC"
          sudo mkdir -p "${QT_PREFIX}"
          sudo chown "$(id -u):$(id -g)" "${QT_PREFIX}"

          # Official IFW module subset (+ qtshadertools required by qtdeclarative).
          MODULES=(
            qtbase
            qtshadertools
            qtdeclarative
            qttools
            qt5compat
            qttranslations
          )
          # 6.9.1 is under archive/ (not official_releases/). Try several mirrors.
          MIRRORS=(
            "https://download.qt.io/archive/qt/${QT_VERSION%.*}/${QT_VERSION}/submodules"
            "https://qt.mirror.constant.com/archive/qt/${QT_VERSION%.*}/${QT_VERSION}/submodules"
            "https://ftp.fau.de/qtproject/archive/qt/${QT_VERSION%.*}/${QT_VERSION}/submodules"
            "https://ftp.jaist.ac.jp/pub/qtproject/archive/qt/${QT_VERSION%.*}/${QT_VERSION}/submodules"
            "https://mirror.accum.se/mirror/qt.io/qtproject/archive/qt/${QT_VERSION%.*}/${QT_VERSION}/submodules"
          )

          download_module() {
            local module="$1"
            local archive="${module}-everywhere-src-${QT_VERSION}.tar.xz"
            local out="${QT_SRC}/${archive}"
            local ok=0
            echo "Downloading ${archive} ..."
            for base in "${MIRRORS[@]}"; do
              echo "  try ${base}/${archive}"
              if wget --tries=3 --timeout=60 -O "${out}" "${base}/${archive}"; then
                # Reject tiny/HTML error pages.
                if [ "$(stat -c%s "${out}")" -gt 100000 ]; then
                  ok=1
                  break
                fi
              fi
              rm -f "${out}"
            done
            if [ "${ok}" -ne 1 ]; then
              echo "::error::Failed to download ${archive} from all mirrors"
              exit 1
            fi
            tar -C "${QT_SRC}" -xf "${out}"
            rm -f "${out}"
            mv "${QT_SRC}/${module}-everywhere-src-${QT_VERSION}" "${QT_SRC}/${module}"
          }

          for module in "${MODULES[@]}"; do
            download_module "${module}"
          done

          # IFW Linux static flags (docs still list -no-qml-debug):
          # https://doc.qt.io/qtinstallerframework/ifw-building-from-sources.html
          #
          # Qt 6.9.1 facts (verified against qtbase config_help.txt + qtdeclarative
          # configure.cmake): qml-debug is a qtdeclarative feature only. It must NOT
          # be passed to qtbase/configure (unknown feature). Disable it when running
          # qt-configure-module on qtdeclarative instead.
          mkdir -p "$HOME/qt-build-qtbase"
          cd "$HOME/qt-build-qtbase"
          "${QT_SRC}/qtbase/configure" \
            -prefix "${QT_PREFIX}" \
            -release \
            -static \
            -accessibility \
            -qt-zlib \
            -qt-libpng \
            -qt-libjpeg \
            -qt-pcre \
            -no-glib \
            -no-cups \
            -no-sql-sqlite \
            -no-feature-gssapi \
            -no-opengl \
            -no-egl \
            -no-sm \
            -no-icu \
            -nomake examples \
            -nomake tests \
            -no-libudev \
            -bundled-xcb-xinput \
            -qt-harfbuzz \
            -qt-doubleconversion \
            -cmake-generator Ninja

          cmake --build . --parallel "$(nproc)"
          cmake --install .

          # Remaining modules against the installed static prefix.
          for module in qtshadertools qtdeclarative qttools qt5compat qttranslations; do
            echo "==== Building ${module} ===="
            build_dir="$HOME/qt-build-${module}"
            rm -rf "${build_dir}"
            mkdir -p "${build_dir}"
            cd "${build_dir}"
            extra_args=()
            if [ "${module}" = "qtdeclarative" ]; then
              extra_args+=(-no-feature-qml-debug)
            fi
            "${QT_PREFIX}/bin/qt-configure-module" "${QT_SRC}/${module}" "${extra_args[@]}"
            cmake --build . --parallel "$(nproc)"
            cmake --install .
          done

          "${QT_PREFIX}/bin/qmake" -v
          test -f "${QT_PREFIX}/lib/libQt6Core.a"
          test -f "${QT_PREFIX}/lib/libQt6Core5Compat.a"
          echo "Static Qt installed at ${QT_PREFIX}"

      - name: Verify static Qt
        run: |
          set -euo pipefail
          test -x "${QT_PREFIX}/bin/qmake"
          "${QT_PREFIX}/bin/qmake" -v
          test -f "${QT_PREFIX}/lib/libQt6Core.a"
          test -f "${QT_PREFIX}/lib/libQt6Core5Compat.a"
          if ls "${QT_PREFIX}/lib"/libQt6Core.so* >/dev/null 2>&1; then
            echo "::error::Found shared libQt6Core.so — expected static Qt only"
            exit 1
          fi

      - name: Build IFW (static)
        run: |
          set -euo pipefail
          export PATH="${QT_PREFIX}/bin:${PATH}"
          which qmake
          qmake -v
          mkdir -p build && cd build
          qmake ../installerfw.pro -r CONFIG+=release \
            "IFW_BZIP2_LIBRARY=-lbz2" \
            "IFW_LZMA_LIBRARY=-llzma"
          make -j"$(nproc)"
          ./bin/installerbase -v || true
          ./bin/binarycreator -v || true
          ls -lh bin/
          echo "==== binarycreator linkage (must not depend on libQt6*.so) ===="
          ldd ./bin/binarycreator || true
          if ldd ./bin/binarycreator | grep -E 'libQt6.*\.so'; then
            echo "::error::binarycreator still links shared Qt6 — static build failed"
            exit 1
          fi

      - name: Package tools
        run: |
          set -euo pipefail
          OUT="ifw-${IFW_VERSION}-linux-x64"
          mkdir -p "$OUT/bin"
          cp -a build/bin/{archivegen,binarycreator,installerbase,repogen} "$OUT/bin/"
          [ -x build/bin/devtool ] && cp -a build/bin/devtool "$OUT/bin/" || true
          cat > "$OUT/README.txt" <<EOF
          Qt Installer Framework ${IFW_VERSION} (linux-x64)
          Built with Qt ${QT_VERSION} (static, official IFW configure flags)
          Source: ${GITHUB_REPOSITORY}@${GITHUB_SHA}
          Patch: FileDownloader DownloadType queued-invoke fix
          Runtime: no Qt shared libraries required; system XCB/OpenSSL may still be needed.
          EOF
          sed -i 's/^          //' "$OUT/README.txt"
          tar -C . -czf "${OUT}.tar.gz" "$OUT"
          ls -lh "${OUT}.tar.gz"
          SIZE_BYTES=$(stat -c%s "${OUT}.tar.gz")
          if [ "$SIZE_BYTES" -lt 15000000 ]; then
            echo "::warning::Artifact looks unusually small (${SIZE_BYTES} bytes) for a static IFW build"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ifw-${{ env.IFW_VERSION }}-linux-x64
          path: ifw-${{ env.IFW_VERSION }}-linux-x64.tar.gz
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          name: IFW ${{ env.IFW_VERSION }} (${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }})
          body: |
            Qt Installer Framework **${{ env.IFW_VERSION }}** tools (linux-x64).

            - Built with **static Qt ${{ env.QT_VERSION }}** (official IFW Linux configure flags)
            - Includes fix for online package download hang (`DownloadType` metatype)
            - Binaries: `archivegen`, `binarycreator`, `installerbase`, `repogen`
            - No Qt shared libraries required at runtime
          files: ifw-${{ env.IFW_VERSION }}-linux-x64.tar.gz
          draft: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
